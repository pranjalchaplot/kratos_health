name: kratos_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  intl: ^0.19.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  app_usage: ^4.0.0
  pedometer: ^4.2.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "asset/icon_data/appstore.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "asset/icon_data/appstore.png"
    background_color: "#0a0a0c"
    theme_color: "#0a0a0c"
  windows:
    generate: true
    image_path: "asset/icon_data/appstore.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - asset/icon_data/appstore.png
    - asset/icon_data/playstore.png
